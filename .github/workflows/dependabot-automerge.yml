name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      min-age-days:
        description: Minimum PR age in days before auto-merging
        required: false
        type: number
        default: 7
      merge-method:
        description: "Merge method: merge, squash, or rebase"
        required: false
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge aged Dependabot PRs
        uses: actions/github-script@v7
        with:
          script: |
            const minAgeDays = ${{ inputs.min-age-days }};
            const mergeMethod = '${{ inputs.merge-method }}';
            const now = new Date();

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            const dependabotPRs = pulls.filter(
              pr => pr.user.login === 'dependabot[bot]'
            );

            if (dependabotPRs.length === 0) {
              console.log('No open Dependabot PRs found.');
              return;
            }

            for (const pr of dependabotPRs) {
              const createdAt = new Date(pr.created_at);
              const ageDays = (now - createdAt) / (1000 * 60 * 60 * 24);

              if (ageDays < minAgeDays) {
                console.log(`#${pr.number} "${pr.title}" is ${ageDays.toFixed(1)} days old — skipping (< ${minAgeDays} days)`);
                continue;
              }

              // Check if PR is mergeable
              const { data: pullDetail } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              if (pullDetail.mergeable_state === 'dirty' || pullDetail.mergeable === false) {
                console.log(`#${pr.number} "${pr.title}" has merge conflicts — skipping`);
                continue;
              }

              // Approve the PR
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                  body: '🤖 Auto-approved: Dependabot PR aged ≥ ' + minAgeDays + ' days.',
                });
                console.log(`#${pr.number} approved`);
              } catch (e) {
                console.log(`#${pr.number} approval skipped: ${e.message}`);
              }

              // Merge the PR
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: mergeMethod,
                  commit_title: pr.title,
                });
                console.log(`#${pr.number} "${pr.title}" merged (${ageDays.toFixed(1)} days old)`);
              } catch (e) {
                console.log(`#${pr.number} merge failed: ${e.message}`);
              }
            }
