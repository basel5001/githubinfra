name: Auto Assign Reviewers

on:
  workflow_call:
    inputs:
      reviewers:
        description: "Comma-separated GitHub usernames for round-robin assignment"
        required: false
        type: string
        default: ""
      team-reviewers:
        description: "Comma-separated team slugs to assign"
        required: false
        type: string
        default: ""
      num-reviewers:
        description: Number of reviewers to assign
        required: false
        type: number
        default: 1
      skip-if-author-is-reviewer:
        description: Skip assigning the PR author as reviewer
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const isBotAuthor = context.payload.pull_request.user.type === 'Bot';

            if (isBotAuthor) {
              console.log('Skipping reviewer assignment for bot PRs');
              return;
            }

            const reviewersInput = '${{ inputs.reviewers }}'.split(',').map(r => r.trim()).filter(Boolean);
            const teamReviewersInput = '${{ inputs.team-reviewers }}'.split(',').map(r => r.trim()).filter(Boolean);
            const numReviewers = ${{ inputs.num-reviewers }};
            const skipAuthor = ${{ inputs.skip-if-author-is-reviewer }};

            // If no explicit reviewers, use repo collaborators
            let candidates = reviewersInput;
            if (candidates.length === 0) {
              const { data: collabs } = await github.rest.repos.listCollaborators({
                owner: context.repo.owner,
                repo: context.repo.repo,
                permission: 'push',
              });
              candidates = collabs.map(c => c.login);
            }

            if (skipAuthor) {
              candidates = candidates.filter(r => r.toLowerCase() !== author.toLowerCase());
            }

            // Round-robin based on PR number
            const selected = [];
            const prNum = context.payload.pull_request.number;
            for (let i = 0; i < Math.min(numReviewers, candidates.length); i++) {
              const idx = (prNum + i) % candidates.length;
              selected.push(candidates[idx]);
            }

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            };

            if (selected.length > 0) {
              params.reviewers = selected;
              console.log(`Assigning reviewers: ${selected.join(', ')}`);
            }
            if (teamReviewersInput.length > 0) {
              params.team_reviewers = teamReviewersInput;
              console.log(`Assigning team reviewers: ${teamReviewersInput.join(', ')}`);
            }

            if (selected.length > 0 || teamReviewersInput.length > 0) {
              await github.rest.pulls.requestReviewers(params);
            } else {
              console.log('No reviewers available to assign');
            }
